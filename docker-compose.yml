services:
  database:
    image: postgres:18-alpine
    container_name: palco-postgres
    environment:
      POSTGRES_DB: portifoliodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5434:5432"
    volumes:
      - palco_postgres_data:/var/lib/postgresql
      - ./database/sos_artistas.sql:/docker-entrypoint-initdb.d/01-sos-artistas.sql:ro
      - ./database/migration_rf03.sql:/docker-entrypoint-initdb.d/02-migration-rf03.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portifoliodb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  palco_postgres_data:
