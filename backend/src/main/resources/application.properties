spring.application.name=backend

# A API usa JWT e nao persiste sessao HTTP. A configuracao explicita tambem
# evita que o DevTools tente reutilizar uma pasta temporaria de outro usuario.
server.servlet.session.persistent=false

spring.datasource.url=jdbc:postgresql://localhost:5432/sos_artistas
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

google.client-id=617453698735-pvnr94qboe4tcmnlsnqbvb5ritjp5qhm.apps.googleusercontent.com
jwt.refresh.expiration-days=30
avatar.dicebear.style=adventurer

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
