spring.application.name=backend

# A API usa JWT e nao persiste sessao HTTP. A configuracao explicita tambem
# evita que o DevTools tente reutilizar uma pasta temporaria de outro usuario.
server.servlet.session.persistent=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/portifoliodb}?stringtype=unspecified
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

google.client-id=617453698735-pvnr94qboe4tcmnlsnqbvb5ritjp5qhm.apps.googleusercontent.com
jwt.refresh.expiration-days=30
avatar.dicebear.style=adventurer

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# RF09: o sender de recuperacao so e habilitado quando MAIL_HOST e MAIL_FROM
# possuem valor. Credenciais e enderecos de producao devem vir do ambiente.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5500}

# RF23/RF06: data_limite_candidatura e um dia civil. No próprio dia limite
# a vaga já não aceita candidatura (hoje >= data_limite_candidatura).
app.vagas.time-zone=${VAGA_TIME_ZONE:America/Sao_Paulo}
app.vagas.auto-close.enabled=${VAGA_AUTO_CLOSE_ENABLED:true}
app.vagas.auto-close.fixed-delay-ms=${VAGA_AUTO_CLOSE_FIXED_DELAY_MS:60000}
app.vagas.auto-close.initial-delay-ms=${VAGA_AUTO_CLOSE_INITIAL_DELAY_MS:60000}
app.vagas.auto-close.batch-size=${VAGA_AUTO_CLOSE_BATCH_SIZE:100}
