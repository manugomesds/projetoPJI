spring.application.name=backend

server.servlet.session.persistent=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Segredo exclusivo do contexto de teste; produção exige JWT_SECRET no ambiente.
jwt.secret=SegredoExclusivoParaTestesAutomatizadosDoBackendPalco2026
jwt.expiration=86400000
jwt.refresh.expiration-days=30

google.client-id=cliente-google-ficticio-para-testes.apps.googleusercontent.com
avatar.dicebear.style=adventurer
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
